body{margin:0;font-family:'Roboto',system-ui,sans-serif;color:#191C1C}
a{color:#006A6A}a:hover{color:#004F4F}
.app{width:390px;height:844px;box-sizing:border-box;background:#F4FBFA;display:flex;flex-direction:column;position:relative;overflow:hidden}
.topbar{height:64px;display:flex;align-items:center;gap:4px;padding:0 4px 0 16px;flex-shrink:0}
.topbar h1{font-size:22px;font-weight:400;margin:0;flex:1}
.textbtn{height:40px;border:0;background:none;color:#006A6A;font:500 14px 'Roboto',sans-serif;padding:0 12px;border-radius:20px}
.content{flex:1;overflow:hidden;padding:4px 16px 0;display:flex;flex-direction:column;gap:12px}
.content > *{flex-shrink:0}
.chips{display:flex;gap:8px;flex-wrap:nowrap;overflow:hidden;margin-right:-16px}
.chip{flex-shrink:0;height:40px;font-size:15px;border:1px solid #6F7979;border-radius:8px;padding:0 12px;display:inline-flex;align-items:center;gap:6px;font:500 14px 'Roboto',sans-serif;color:#3F4948;background:transparent}
.chip.sel{background:#CCE8E7;border-color:#CCE8E7;color:#051F1F;padding-left:8px}
.card{display:flex;align-items:center;gap:14px;padding:12px 14px;border:1px solid #BEC9C8;border-radius:12px;box-sizing:border-box;text-decoration:none;color:#191C1C}
.date{width:48px;display:flex;flex-direction:column;align-items:center;flex-shrink:0}
.date b{font-size:22px;font-weight:500;line-height:26px}
.date span{font-size:12px;color:#3F4948;letter-spacing:.5px}
.sub{font-size:14px;color:#3F4948}
.status{display:inline-flex;align-self:flex-start;height:24px;align-items:center;padding:0 8px;border-radius:6px;font:500 12px 'Roboto',sans-serif;margin-top:6px}
.small{font-size:12px;color:#3F4948}
.nav{height:80px;background:#E3EAE9;display:flex;justify-content:space-around;align-items:center;flex-shrink:0}
.navitem{display:flex;flex-direction:column;align-items:center;gap:4px;font:500 12px 'Roboto',sans-serif;color:#3F4948;text-decoration:none;width:96px}
.navitem .pill{width:64px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center}
.navitem.on{color:#191C1C}
.navitem.on .pill{background:#CCE8E7;color:#051F1F}
