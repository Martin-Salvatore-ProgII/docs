<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Turnos disponibles</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap">
<style>
body{margin:0;font-family:'Roboto',system-ui,sans-serif;color:#191C1C}
a{color:#006A6A}a:hover{color:#004F4F}
.app{width:390px;height:844px;box-sizing:border-box;background:#F4FBFA;display:flex;flex-direction:column;position:relative;overflow:hidden}
.topbar{height:64px;display:flex;align-items:center;gap:4px;padding:0 16px 0 4px;flex-shrink:0}
.topbar h1{font-size:22px;font-weight:400;margin:0;flex:1}
.iconbtn{width:48px;height:48px;border:0;background:none;border-radius:24px;display:flex;align-items:center;justify-content:center;color:#191C1C;padding:0;text-decoration:none}
.content{flex:1;overflow:hidden;padding:0 16px;display:flex;flex-direction:column;gap:20px}
.sub{font-size:14px;color:#3F4948}
.daybar{display:flex;align-items:center;justify-content:space-between;border:1px solid #BEC9C8;border-radius:28px;padding:4px}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.slot{height:48px;border:1px solid #6F7979;border-radius:12px;background:none;font:500 16px 'Roboto',sans-serif;color:#191C1C}
.slot.sel{background:#006A6A;border-color:#006A6A;color:#FFFFFF}
.cta{display:flex;align-items:center;justify-content:center;height:48px;border-radius:24px;background:#006A6A;color:#FFFFFF;font:500 16px 'Roboto',sans-serif;text-decoration:none}
.cta:hover{color:#FFFFFF}
</style>
</helmet>
<div class="app">
  <header class="topbar">
    <a class="iconbtn" href="Profesional.dc.html" aria-label="Volver"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12H4m6-6-6 6 6 6"></path></svg></a>
    <h1>Turnos disponibles</h1>
  </header>

  <main class="content">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 18px">Martín Rivas</span>
      <span class="sub">Cardiología</span>
    </div>

    <div class="daybar">
      <button class="iconbtn" aria-label="Día anterior"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m15 6-6 6 6 6"></path></svg></button>
      <span style="font-size: 16px; font-weight: 500">Jueves 26 de noviembre</span>
      <button class="iconbtn" aria-label="Día siguiente"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 6 6 6-6 6"></path></svg></button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 12px">
      <span class="sub">5 turnos libres · 30 min</span>
      <div class="slots">
        <button class="slot">18:00</button>
        <button class="slot">18:30</button>
        <button class="slot sel" aria-pressed="true">19:30</button>
        <button class="slot">20:00</button>
        <button class="slot">20:30</button>
      </div>
    </div>

    <p class="sub" style="margin: 0; font-size: 12px; line-height: 16px">Un turno libre no está garantizado hasta que la reserva se confirma.</p>
  </main>

  <div style="padding: 16px 16px 24px">
    <a class="cta" href="Reserva.dc.html">Reservar 19:30</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
