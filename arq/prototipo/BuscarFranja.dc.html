<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Elegir franja horaria</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap">
<style>
body{margin:0;font-family:'Roboto',system-ui,sans-serif;color:#191C1C}
a{color:#006A6A}a:hover{color:#004F4F}
.app{width:390px;height:844px;box-sizing:border-box;background:#F4FBFA;display:flex;flex-direction:column;position:relative;overflow:hidden}
.topbar{height:64px;display:flex;align-items:center;padding:0 4px 0 16px;flex-shrink:0}
.topbar h1{font-size:22px;font-weight:400;margin:0;flex:1}
.ghost{border:1px solid #BEC9C8;border-radius:16px;flex-shrink:0}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,0.32);display:flex;flex-direction:column;justify-content:flex-end}
.sheet{background:#EEF5F4;border-radius:28px 28px 0 0;padding:8px 0 24px;display:flex;flex-direction:column}
.handle{width:32px;height:4px;border-radius:2px;background:#6F7979;align-self:center;margin:14px 0 18px}
.sheet h2{margin:0 24px 2px;font-size:22px;font-weight:400}
.hint{margin:0 24px 10px;font-size:14px;color:#3F4948}
.opt{display:flex;align-items:center;gap:16px;height:56px;padding:0 24px;border:0;background:none;font:400 17px 'Roboto',sans-serif;color:#191C1C;text-align:left;width:100%;box-sizing:border-box}
.opt span{flex:1}
.opt small{font-size:14px;color:#3F4948}
.opt.on{background:#CCE8E7;color:#051F1F;font-weight:500}
.field{position:relative;height:56px;border:1px solid #6F7979;border-radius:4px;display:flex;align-items:center;gap:10px;padding:0 12px 0 16px;box-sizing:border-box;color:#3F4948;min-width:0}
.field input{border:0;background:none;font:400 17px 'Roboto',sans-serif;color:#191C1C;flex:1;min-width:0;outline:none;padding:0}
.field .lab{position:absolute;top:-9px;left:12px;padding:0 4px;background:#EEF5F4;font-size:12px;color:#3F4948}
.cta{height:48px;border-radius:24px;background:#006A6A;color:#FFFFFF;border:0;font:500 16px 'Roboto',sans-serif}
</style>
</helmet>
<div class="app">
  <header class="topbar"><h1>Buscar</h1></header>
  <div style="flex: 1; padding: 8px 16px; display: flex; flex-direction: column; gap: 16px" aria-hidden="true">
    <div class="ghost" style="height: 56px; border-radius: 28px; background: #E3EAE9; border: 0"></div>
    <div style="display: flex; gap: 8px"><div class="ghost" style="width: 120px; height: 40px; border-radius: 10px"></div><div class="ghost" style="width: 110px; height: 40px; border-radius: 10px"></div></div>
  </div>

  <div class="scrim">
    <section class="sheet" role="dialog" aria-labelledby="t">
      <span class="handle" aria-hidden="true"></span>
      <h2 id="t">Franja horaria</h2>
      <p class="hint">Jueves 26 de noviembre</p>
      <button class="opt"><span>Cualquier hora</span></button>
      <button class="opt"><span>Mañana</span><small>hasta las 12</small></button>
      <button class="opt"><span>Tarde</span><small>de 12 a 18</small></button>
      <button class="opt"><span>Noche</span><small>desde las 18</small></button>
      <button class="opt on"><span>Personalizada</span><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg></button>

      <div style="display: flex; flex-direction: column; gap: 20px; padding: 20px 24px 0">
        <div class="field">
          <span class="lab">Desde</span>
          <input aria-label="Desde" value="10:00" readonly>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
        </div>
        <div class="field">
          <span class="lab">Hasta</span>
          <input aria-label="Hasta" value="11:00" readonly>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
        </div>
        <button class="cta">Aplicar</button>
      </div>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
