<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap">
<style>
body{margin:0;font-family:'Roboto',system-ui,sans-serif;color:#191C1C}
a{color:#006A6A}a:hover{color:#004F4F}
.app{width:390px;height:844px;box-sizing:border-box;background:#F4FBFA;display:flex;flex-direction:column;position:relative;overflow:hidden}
.topbar{height:64px;display:flex;align-items:center;gap:4px;padding:0 4px 0 16px;flex-shrink:0}
.topbar h1{font-size:22px;font-weight:400;margin:0;flex:1}
.iconbtn{width:48px;height:48px;border:0;background:none;border-radius:24px;display:flex;align-items:center;justify-content:center;color:#3F4948;padding:0;flex-shrink:0}
.content{flex:1;overflow:hidden;padding:4px 16px 0;display:flex;flex-direction:column;gap:10px}
.content > *{flex-shrink:0}
.chips{display:flex;gap:8px;padding-bottom:6px}
.chip{flex-shrink:0;height:40px;border:1px solid #6F7979;border-radius:8px;padding:0 14px;display:inline-flex;align-items:center;gap:6px;font:500 14px 'Roboto',sans-serif;color:#3F4948;background:transparent}
.chip.sel{background:#CCE8E7;border-color:#CCE8E7;color:#051F1F;padding-left:8px}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;padding:0 24px 80px}
.empty .ico{width:72px;height:72px;border-radius:36px;background:#E3EAE9;color:#3F4948;display:flex;align-items:center;justify-content:center;margin-bottom:4px}
.empty h2{margin:0;font-size:20px;font-weight:400}
.sub{font-size:14px;color:#3F4948;line-height:20px}
.cta{display:flex;align-items:center;justify-content:center;height:48px;border-radius:24px;background:#006A6A;color:#FFFFFF;border:0;font:500 16px 'Roboto',sans-serif;text-decoration:none;padding:0 28px;margin-top:8px}
.cta:hover{color:#FFFFFF}
.nav{height:80px;background:#E3EAE9;display:flex;justify-content:space-around;align-items:center;flex-shrink:0}
.navitem{display:flex;flex-direction:column;align-items:center;gap:4px;font:500 12px 'Roboto',sans-serif;color:#3F4948;text-decoration:none;width:96px}
.navitem .pill{width:64px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center}
.navitem.on{color:#191C1C}
.navitem.on .pill{background:#CCE8E7;color:#051F1F}
</style>
</helmet>
<div class="app">
  <header class="topbar">
    <h1>Mis reservas</h1>
    <button class="iconbtn" aria-label="Cerrar sesión"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h3M16 17l5-5-5-5M21 12H9"></path></svg></button>
  </header>

  <main class="content">
    <div class="chips" role="group" aria-label="Estado">
      <button class="chip sel"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg>Todas</button>
      <button class="chip">Confirmadas</button>
      <button class="chip">Canceladas</button>
    </div>

    <div class="empty">
      <span class="ico"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg></span>

      <span class="sub">Cuando reserves un turno, lo vas a ver acá.</span>
      <a class="cta" href="Main.dc.html">Buscar profesionales</a>
    </div>
  </main>

  <nav class="nav" aria-label="Secciones">
    <a class="navitem" href="Main.dc.html"><span class="pill"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></span>Buscar</a>
    <a class="navitem on" href="MisReservas.dc.html"><span class="pill"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg></span>Mis reservas</a>
  </nav>
</div>
