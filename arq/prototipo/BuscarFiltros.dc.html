<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap">
<style>
body{margin:0;font-family:'Roboto',system-ui,sans-serif;color:#191C1C}
a{color:#006A6A}a:hover{color:#004F4F}
.app{width:390px;height:844px;box-sizing:border-box;background:#F4FBFA;display:flex;flex-direction:column;position:relative;overflow:hidden}
.topbar{height:64px;display:flex;align-items:center;gap:4px;padding:0 4px 0 16px;flex-shrink:0}
.topbar h1{font-size:22px;font-weight:400;margin:0;flex:1}
.iconbtn{width:48px;height:48px;border:0;background:none;border-radius:24px;display:flex;align-items:center;justify-content:center;color:#3F4948;padding:0;flex-shrink:0}
.content{flex:1;min-height:0;overflow:hidden;padding:8px 16px 0;display:flex;flex-direction:column;gap:16px}
.content > *{flex-shrink:0}
.searchbar{height:56px;border-radius:28px;background:#E3EAE9;display:flex;align-items:center;gap:12px;padding:0 20px;box-sizing:border-box;color:#3F4948}
.searchbar input{border:0;background:none;font:400 17px 'Roboto',sans-serif;color:#191C1C;flex:1;min-width:0;outline:none;padding:0}
.searchbar input::placeholder{color:#5A6464}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{height:40px;border:1px solid #6F7979;border-radius:10px;padding:0 10px 0 14px;display:inline-flex;align-items:center;gap:4px;font:500 15px 'Roboto',sans-serif;color:#3F4948;background:transparent;flex-shrink:0;text-decoration:none}
.chip.on{background:#CCE8E7;border-color:#CCE8E7;color:#051F1F;gap:6px}
.chip.on span.x{width:28px;height:28px;margin-right:-4px;border-radius:14px;display:flex;align-items:center;justify-content:center}
.count{font-size:14px;color:#3F4948}
.card{display:flex;align-items:center;gap:16px;min-height:76px;padding:12px 8px 12px 16px;border:1px solid #BEC9C8;border-radius:16px;box-sizing:border-box;text-decoration:none;color:#191C1C}
.avatar{width:44px;height:44px;border-radius:22px;background:#CCE8E7;color:#051F1F;display:flex;align-items:center;justify-content:center;font-weight:500;font-size:16px;flex-shrink:0}
.name{font-size:17px}
.sub{font-size:14px;color:#3F4948}
.nav{height:80px;background:#E3EAE9;display:flex;justify-content:space-around;align-items:center;flex-shrink:0}
.navitem{display:flex;flex-direction:column;align-items:center;gap:4px;font:500 12px 'Roboto',sans-serif;color:#3F4948;text-decoration:none;width:96px}
.navitem .pill{width:64px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center}
.navitem.on{color:#191C1C}
.navitem.on .pill{background:#CCE8E7;color:#051F1F}
</style>
</helmet>
<div class="app">
  <header class="topbar">
    <h1>Buscar</h1>
    <button class="iconbtn" aria-label="Cerrar sesión"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h3M16 17l5-5-5-5M21 12H9"></path></svg></button>
  </header>

  <main class="content">
    <div class="searchbar">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <input aria-label="Nombre o apellido" placeholder="Buscá por nombre o apellido" value="mar">
      <button class="iconbtn" aria-label="Borrar" style="margin-right: -12px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
    </div>

    <div class="chips">
      <a class="chip on" href="BuscarCategoria.dc.html">Cardiología<span class="x" aria-label="Quitar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></span></a>
      <button class="chip on">Jue 26 nov<span class="x" aria-label="Quitar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></span></button>
      <a class="chip on" href="BuscarFranja.dc.html">Noche<span class="x" aria-label="Quitar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></span></a>
      <button class="chip">Habilitados<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m7 10 5 5 5-5"></path></svg></button>
    </div>

    <span class="count">1 profesional</span>

    <a class="card" href="Profesional.dc.html">
      <span class="avatar">MR</span>
      <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span class="name">Martín Rivas</span><span class="sub">Cardiología</span></span>
      <span class="iconbtn" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 6 6 6-6 6"></path></svg></span>
    </a>
  </main>

  <nav class="nav" aria-label="Secciones">
    <a class="navitem on" href="Main.dc.html"><span class="pill"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></span>Buscar</a>
    <a class="navitem" href="MisReservas.dc.html"><span class="pill"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg></span>Mis reservas</a>
  </nav>
</div>
